name: build-dripeuszekfarm
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dripeuszekfarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DripeuszekFarm
          path: dripeuszekfarm/build/libs/*.jar
