name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: dripeuszekcraftcube-1.1.0-zrodla/dripeuszekcraftcube/dripeuszekcraftcube-1.2.0-zrodla/dripeuszekcraftcube
      - uses: actions/upload-artifact@v4
        with:
          name: dripeuszekcraftcube
          path: dripeuszekcraftcube-1.1.0-zrodla/dripeuszekcraftcube/dripeuszekcraftcube-1.2.0-zrodla/dripeuszekcraftcube/build/libs/*.jar
