name: build-dripeuszekfarm
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Znajdz projekt farmy
        id: find
        run: |
          F=$(grep -rl "depositNeeded" --include=FarmBot.java . | head -n1)
          if [ -z "$F" ]; then F=$(find . -ipath '*dripeuszekfarm*' -name FarmBot.java | head -n1); fi
          DIR=$(echo "$F" | sed 's#/src/main/java/.*##')
          echo "Projekt: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DripeuszekFarm
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
